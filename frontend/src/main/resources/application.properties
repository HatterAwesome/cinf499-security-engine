spring.application.name=SecureDemo
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/accesscontrol_db}
server.port=8080

# Secure floorplan and text uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${APP_UPLOAD_DIR:./secure-uploads}

# Avoid exposing internal error details to users
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# AI floor plan generation configuration
app.floorplan.project-root=${FLOORPLAN_PROJECT_ROOT:..}
app.floorplan.python=${FLOORPLAN_PYTHON:../pix2pix/.venv/bin/python}
app.floorplan.timeout-seconds=120
